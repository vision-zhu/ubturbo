<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">UBTurbo module lifecycle</title>
  <desc id="desc">Modules initialize and start in configuration, logging, SMAP, plugin and IPC order. Stop and uninitialize run in reverse order.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#40566f"/></marker><style>.b{fill:#edf5ff;stroke:#40566f;stroke-width:2}.t{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172b3a;text-anchor:middle}.h{font-size:22px;font-weight:700}.s{font-size:16px}.l{stroke:#40566f;stroke-width:2;marker-end:url(#a)}.r{stroke:#b34a4a}</style></defs>
  <rect width="1200" height="360" fill="#fff"/><text class="t h" x="600" y="36">UBTurbo module lifecycle</text>
  <text class="t s" x="95" y="115">Init / Start</text><text class="t s" x="1100" y="295">Stop / UnInit</text>
  <g><rect class="b" x="150" y="75" width="160" height="70" rx="9"/><text class="t h" x="230" y="118">Config</text><rect class="b" x="345" y="75" width="160" height="70" rx="9"/><text class="t h" x="425" y="118">Logger</text><rect class="b" x="540" y="75" width="160" height="70" rx="9"/><text class="t h" x="620" y="118">SMAP</text><rect class="b" x="735" y="75" width="160" height="70" rx="9"/><text class="t h" x="815" y="118">Plugins</text><rect class="b" x="930" y="75" width="160" height="70" rx="9"/><text class="t h" x="1010" y="118">IPC</text></g>
  <path class="l" d="M310 110 H345"/><path class="l" d="M505 110 H540"/><path class="l" d="M700 110 H735"/><path class="l" d="M895 110 H930"/>
  <path class="l r" d="M1010 245 H815"/><path class="l r" d="M815 245 H620"/><path class="l r" d="M620 245 H425"/><path class="l r" d="M425 245 H230"/>
  <text class="t s" x="600" y="195">A failure aborts Run; Stop still traverses all modules in reverse order.</text>
</svg>
